<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes y cobros | AromArt Shop</title><link rel="stylesheet" href="clientes.css"></head><body><header><div><strong>AROMART SHOP</strong><small>Administración · Clientes y cobros</small></div><a href="panel.html">← Volver al panel</a></header><main><div id="alert" role="alert"></div><section class="metrics"><article><span>Por cobrar</span><b id="due">S/ 0.00</b></article><article><span>Separaciones activas</span><b id="reserved">0</b></article><article><span>Clientes</span><b id="count">0</b></article></section><section class="grid"><article><h2>Nuevo cliente</h2><form id="clientForm"><label>Nombre<input name="name" required maxlength="120"></label><label>WhatsApp (9 dígitos)<input name="phone" inputmode="tel" pattern="9[0-9]{8}" placeholder="987654321"></label><button>Guardar cliente</button></form></article><article><h2>Registrar operación</h2><form id="operationForm"><label>Cliente<select name="client_id" id="clientSelect" required></select></label><label>Tipo<select name="kind"><option value="fiado">Venta fiada (producto entregado)</option><option value="separado">Producto separado (no entregado)</option><option value="venta">Venta pagada</option></select></label><label>Producto del inventario<select name="product_id" id="accountProduct" required></select></label><label>Cantidad<input name="qty" type="number" min="1" value="1" required></label><label>Importe total (S/)<input name="total" type="number" min="0.01" step="0.01" required></label><label>Primer pago (S/)<input name="paid" type="number" min="0" step="0.01" value="0" required></label><label>Método<select name="method"><option>Yape</option><option>Plin</option><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></label><label>Vencimiento (opcional)<input name="due_date" type="date"></label><button>Registrar operación</button><p class="hint">Los productos y el stock se sincronizan con el inventario.</p></form></article></section><section><h2>Clientes y cuentas</h2><input id="search" placeholder="Buscar cliente o producto"><div id="records"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="clientes.js"></script></body></html>
